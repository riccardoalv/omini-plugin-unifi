id: unifi
name: UniFi Network
version: 0.3.0
protocol: 1
entrypoint: main.py
timeout_s: 90
description: >-
  UniFi Network controller (UniFi OS consoles or the self-hosted Network
  Application): every adopted gateway, switch and access point with ports, link
  speed, traffic counters, LLDP and uplinks, spanning tree and aggregates (LAGs),
  Wi-Fi and wired clients, radios and their channels, VLANs, WAN status, CPU,
  memory, temperatures and pending firmware, and the gateway's networks, fixed
  addresses, DHCP clients, local DNS names, paused devices and port forwards;
  backs up each device's and the site's settings (no secrets); enables or
  disables switch ports, sets a switch port's VLANs, creates, renames and
  deletes VLAN-only networks, manages Wi-Fi per VLAN, moves an access point's
  radio to another channel, changes the gateway's networks, fixed addresses and
  DNS names, and pauses a device's internet (saved by the controller, checked
  on the devices).
author: Omini
homepage: https://github.com/riccardoalv/omini-plugin-unifi
backup: true
changes:
  - port.enabled
  - port.vlans
  - vlan.set
  - vlan.delete
  - wifi.set
  - wifi.delete
  - wifi.channel
  - network.set
  - network.delete
  - reservation.set
  - reservation.delete
  - dns.set
  - dns.delete
  - pause.set
  - pause.delete
fields:
  - key: url
    type: url
    label: Address
    required: true
    help: >-
      The console or controller, e.g. https://192.168.1.1 (UniFi OS) or
      https://192.168.1.10:8443 (self-hosted Network Application).
  - key: username
    type: string
    label: Username
    required: true
    help: >-
      A local admin whose Network role is Full Management or Site Admin (View
      Only reads the map but cannot change anything); not a UI.com / SSO account,
      no two-factor authentication: see the plugin's README.
  - key: password
    type: secret
    label: Password
    required: true
  - key: site
    type: string
    label: Site
    default: default
    help: >-
      The site's internal name, as in the address of the Network application
      (/manage/<site>/...); "default" for the first site.
  - key: verify_tls
    type: bool
    label: Verify the TLS certificate
    default: false
    group: Advanced
    help: UniFi uses a self-signed certificate by default; turn this on if yours is trusted.
  - key: timeout_s
    type: int
    label: Timeout (seconds)
    default: 15
    group: Advanced
    help: How long to wait for each answer of the controller.
